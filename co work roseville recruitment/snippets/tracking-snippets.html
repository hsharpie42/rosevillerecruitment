     Roseville tracking snippets  (25 Oct 2026)

     Block C goes before </body> on all five pages.

     ============================================================================ -->

<!-- BLOCK A: Google Analytics 4 -->

  function gtag(){ dataLayer.push(arguments); }
  gtag('js', new Date());
  gtag('config', 'G-XXXXXXXXXX');
</script>

<!-- BLOCK B: Meta Pixel -->
<script>
  !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
  n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
  n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;

<!-- BLOCK C: UTM capture + form_viewed (application_submit / Lead are fired by the form handler) -->
<script>
(function () {
  // Persist utm_* for the session so a visitor who lands on the hub and then opens a home page keeps attribution.
  var params = new URLSearchParams(window.location.search);
  ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content'].forEach(function (k) {
    var v = params.get(k);
    if (v) { try { sessionStorage.setItem(k, v); } catch (e) {} }
  });

  // form_viewed: once, when the application form scrolls into view.
  var formWrapper = document.getElementById('form-wrapper');
  if (!formWrapper || !('IntersectionObserver' in window)) return;
  var fired = false;
  var observer = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (fired || !entry.isIntersecting) return;
      fired = true;
      observer.disconnect();
      if (typeof gtag === 'function') gtag('event', 'form_viewed', { page: window.location.pathname });
    });
  }, { threshold: 0.25 });
  observer.observe(formWrapper);
})();
</script>
